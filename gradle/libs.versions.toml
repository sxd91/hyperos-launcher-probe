[versions]
agp = "9.3.1"
kotlin = "2.4.10"
libxposed = "102.0.0"

[libraries]
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# 注意：不声明 org.jetbrains.kotlin.android。AGP 9.0 起内置 Kotlin 支持，
# 再应用该插件会在 apply 阶段直接失败。
